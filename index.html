<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Answer Key Audio (Fast Mode)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }
        h1 { color: #333; margin-bottom: 20px; font-size: 22px;}
        
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: background 0.3s;
            font-weight: bold;
        }

        .btn-math { background-color: #e74c3c; }
        .btn-phy { background-color: #3498db; }
        .btn-chem { background-color: #f1c40f; color: #333; }
        .btn-bio { background-color: #2ecc71; }
        .btn-stop { background-color: #333; grid-column: span 2; margin-top: 10px;}

        button:hover { opacity: 0.9; transform: scale(1.02); }

        .display-area {
            margin-top: 20px;
            font-size: 40px; /* ফন্ট বড় করা হয়েছে যাতে দূর থেকে দেখা যায় */
            font-weight: bold;
            color: #2c3e50;
            min-height: 60px;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 5px;
            border: 2px solid #bdc3c7;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speed-control {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        label { font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔊 Fast Answer Checker</h1>
    
    <div class="speed-control">
        <label for="rate">Speed:</label>
        <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9">
        <span id="speed-val">Normal</span>
    </div>

    <div class="controls">
        <button class="btn-math" onclick="readAnswers('Mathematics')">Math</button>
        <button class="btn-phy" onclick="readAnswers('Physics')">Physics</button>
        <button class="btn-chem" onclick="readAnswers('Chemistry')">Chemistry</button>
        <button class="btn-bio" onclick="readAnswers('Biology')">Biology</button>
        <button class="btn-stop" onclick="stopReading()">🛑 STOP</button>
    </div>

    <div id="display" class="display-area">
        Ready
    </div>
</div>

<script>
    const answerData = {
        'Mathematics': [
            "1 D", "2 C", "3 C", "4 C", "5 C", 
            "6 B", "7 A", "8 B", "9 C", "10 D", 
            "11 C", "12 C", "13 A", "14 A", "15 C", 
            "16 C", "17 B", "18 A", "19 D", "20 A", 
            "21 B", "22 D", "23 B", "24 B", "25 A"
        ],
        'Physics': [
            "1 B", "2 C", "3 B", "4 B", "5 A", 
            "6 B", "7 D", "8 B", "9 C", "10 C", 
            "11 A", "12 C", "13 B", "14 C", "15 A", 
            "16 C", "17 A", "18 B", "19 C", "20 A", 
            "21 A", "22 B", "23 A", "24 A", "25 A"
        ],
        'Chemistry': [
            "1 C", "2 C", "3 A", "4 C", "5 A", 
            "6 D", "7 C", "8 B", "9 B", "10 B", 
            "11 B", "12 D", "13 C", "14 D", "15 B", 
            "16 B", "17 B", "18 A", "19 B", "20 D", 
            "21 C", "22 B", "23 B", "24 C", "25 C"
        ],
        'Biology': [
            "1 C", "2 B", "3 B", "4 A", "5 D", 
            "6 C Grace", "7 C Grace", "8 A Grace", "9 A", "10 C", 
            "11 B", "12 B", "13 C Grace", "14 C", "15 B", 
            "16 A", "17 D", "18 B", "19 D", "20 A", 
            "21 B Grace", "22 B", "23 D", "24 A", "25 C"
        ]
    };

    let synth = window.speechSynthesis;

    document.getElementById('rate').addEventListener('input', function(e) {
        let val = e.target.value;
        document.getElementById('speed-val').innerText = `${val}x`;
    });

    function stopReading() {
        if (synth.speaking) {
            synth.cancel();
            document.getElementById('display').innerText = "Stopped";
        }
    }

    function readAnswers(subject) {
        stopReading();

        const answers = answerData[subject];
        const rate = document.getElementById('rate').value;
        const display = document.getElementById('display');
        
        // Subject announcement
        let titleUtterance = new SpeechSynthesisUtterance(subject);
        titleUtterance.rate = rate;
        synth.speak(titleUtterance);
        
        display.innerText = subject;

        answers.forEach((item) => {
            let parts = item.split(" ");
            let questionNum = parts[0];
            let option = parts[1];
            let extra = parts.slice(2).join(" "); 

            // CHANGE: Short format "1... D"
            // The comma creates a micro-pause which is better for listening
            let speakText = `${questionNum}, ${option}`;
            
            if(extra) {
                speakText += `, ${extra}`; 
            }

            let utter = new SpeechSynthesisUtterance(speakText);
            utter.rate = rate;
            
            // On start of each number, update display
            utter.onstart = function() {
                // Display looks like "1 -> D"
                display.innerText = `${questionNum} ➝ ${option} ${extra ? '('+extra+')' : ''}`;
            };

            synth.speak(utter);
        });

        let endUtter = new SpeechSynthesisUtterance("Done");
        endUtter.rate = rate;
        endUtter.onstart = function() {
            display.innerText = "Done ✅";
        };
        synth.speak(endUtter);
    }
</script>

</body>
</html>
