<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Audio Key</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 { color: #2c3e50; text-align: center; font-size: 22px; margin: 0 0 5px 0;}
        p { color: #7f8c8d; text-align: center; font-size: 14px; margin-bottom: 20px;}

        /* Subject List */
        .subject-list {
            margin-bottom: 20px;
            background: #fff;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
        }
        .subject-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #eee;
        }
        .subject-row:last-child { border-bottom: none; }
        .chk-group { font-weight: 600; color: #34495e; display: flex; align-items: center; gap: 8px; cursor: pointer;}
        .start-group { font-size: 14px; color: #666; display: flex; align-items: center; gap: 5px;}
        .q-input { width: 50px; padding: 5px; border: 1px solid #ccc; border-radius: 4px; text-align: center; font-weight: bold;}

        /* Voice Selection (Simple) */
        .voice-box {
            background: #eef2f3;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .radio-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 10px;
        }
        .radio-label {
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 10px 20px;
            background: white;
            border-radius: 20px;
            border: 2px solid #bdc3c7;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        /* Checkbox styling hacks for looks */
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label {
            background-color: #3498db;
            color: white;
            border-color: #3498db;
        }

        /* Speed Control */
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }

        /* Main Buttons */
        .main-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            transition: 0.2s;
        }
        button:active { transform: scale(0.98); }
        .btn-play { background-color: #27ae60; grid-column: span 2; font-size: 18px;}
        .btn-pause { background-color: #e67e22; }
        .btn-stop { background-color: #c0392b; }
        .btn-test { background-color: #7f8c8d; font-size: 12px; padding: 5px 10px; border-radius: 15px; margin-left: 10px;}

        /* Display */
        .display-area {
            margin-top: 10px;
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
            min-height: 100px;
            padding: 20px;
            background: #fff;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .sub-text { font-size: 16px; color: #95a5a6; font-weight: normal; margin-top: 5px;}
        .active-subject { font-size: 18px; color: #8e44ad; margin-bottom: 5px; text-transform: uppercase;}
        
        .playing { border-color: #2ecc71; background-color: #f0fff4; }
        .paused { border-color: #e67e22; background-color: #fffaf0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎧 Audio Key</h1>
    <p>Select Subjects & Voice</p>

    <div class="subject-list">
        <div class="subject-row">
            <label class="chk-group"><input type="checkbox" id="chk-Mathematics" checked> Mathematics</label>
            <div class="start-group">Q: <input type="number" id="start-Mathematics" class="q-input" value="1" min="1" max="25"></div>
        </div>
        <div class="subject-row">
            <label class="chk-group"><input type="checkbox" id="chk-Physics" checked> Physics</label>
            <div class="start-group">Q: <input type="number" id="start-Physics" class="q-input" value="1" min="1" max="25"></div>
        </div>
        <div class="subject-row">
            <label class="chk-group"><input type="checkbox" id="chk-Chemistry" checked> Chemistry</label>
            <div class="start-group">Q: <input type="number" id="start-Chemistry" class="q-input" value="1" min="1" max="25"></div>
        </div>
        <div class="subject-row">
            <label class="chk-group"><input type="checkbox" id="chk-Biology" checked> Biology</label>
            <div class="start-group">Q: <input type="number" id="start-Biology" class="q-input" value="1" min="1" max="25"></div>
        </div>
    </div>

    <div class="voice-box">
        <div class="radio-group">
            <input type="radio" id="voiceMale" name="voiceGender" value="male" checked>
            <label for="voiceMale" class="radio-label">👨 Male</label>

            <input type="radio" id="voiceFemale" name="voiceGender" value="female">
            <label for="voiceFemale" class="radio-label">👩 Female</label>
        </div>
        
        <div class="speed-control">
            <button class="btn-test" onclick="testVoice()">🔊 Check Voice</button>
            <label style="margin-left: 15px;">Speed:</label>
            <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="0.9">
            <span id="speed-val">0.9x</span>
        </div>
    </div>

    <div class="main-actions">
        <button class="btn-play" onclick="startCustomPlay()">▶ Start Reading</button>
        <button id="pauseBtn" class="btn-pause" onclick="togglePause()">⏸ Pause</button>
        <button class="btn-stop" onclick="stopEverything()">🛑 Reset</button>
    </div>

    <div id="display" class="display-area">
        Ready
    </div>
</div>

<script>
    // --- DATA ---
    const answerData = {
        'Mathematics': ["1 D", "2 C", "3 C", "4 C", "5 C", "6 B", "7 A", "8 B", "9 C", "10 D", "11 C", "12 C", "13 A", "14 A", "15 C", "16 C", "17 B", "18 A", "19 D", "20 A", "21 B", "22 D", "23 B", "24 B", "25 A"],
        'Physics': ["1 B", "2 C", "3 B", "4 B", "5 A", "6 B", "7 D", "8 B", "9 C", "10 C", "11 A", "12 C", "13 B", "14 C", "15 A", "16 C", "17 A", "18 B", "19 C", "20 A", "21 A", "22 B", "23 A", "24 A", "25 A"],
        'Chemistry': ["1 C", "2 C", "3 A", "4 C", "5 A", "6 D", "7 C", "8 B", "9 B", "10 B", "11 B", "12 D", "13 C", "14 D", "15 B", "16 B", "17 B", "18 A", "19 B", "20 D", "21 C", "22 B", "23 B", "24 C", "25 C"],
        'Biology': ["1 C", "2 B", "3 B", "4 A", "5 D", "6 C Grace", "7 C Grace", "8 A Grace", "9 A", "10 C", "11 B", "12 B", "13 C Grace", "14 C", "15 B", "16 A", "17 D", "18 B", "19 D", "20 A", "21 B Grace", "22 B", "23 D", "24 A", "25 C"]
    };

    const letterMap = {'A': '1', 'B': '2', 'C': '3', 'D': '4'};
    const subjects = ['Mathematics', 'Physics', 'Chemistry', 'Biology'];

    let synth = window.speechSynthesis;
    let voices = [];
    let playlist = [];
    let currentIndex = 0;
    let isPaused = false;
    let currentUtterance = null;

    // --- VOICE LOGIC (AUTO DETECT) ---
    function loadVoices() {
        voices = synth.getVoices();
    }
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = loadVoices;
    }

    function getSelectedVoice() {
        const gender = document.querySelector('input[name="voiceGender"]:checked').value;
        let selectedVoice = null;

        if (gender === 'male') {
            // Try to find a voice named David, Male, or Daniel
            selectedVoice = voices.find(v => v.name.includes("David") || v.name.includes("Male") || v.name.includes("Daniel"));
            // Fallback: If no male found, take the very first English voice (often default)
            if (!selectedVoice) selectedVoice = voices[0];
        } else {
            // Try to find Zira, Female, Google US, or Samantha
            selectedVoice = voices.find(v => v.name.includes("Zira") || v.name.includes("Female") || v.name.includes("Google") || v.name.includes("Samantha"));
            // Fallback: If no female found, try to take the 2nd voice available
            if (!selectedVoice && voices.length > 1) selectedVoice = voices[1];
            if (!selectedVoice) selectedVoice = voices[0];
        }
        return selectedVoice;
    }

    function testVoice() {
        synth.cancel();
        let utter = new SpeechSynthesisUtterance("Testing voice. Question 1, Answer 4.");
        utter.rate = document.getElementById('rate').value;
        utter.voice = getSelectedVoice();
        synth.speak(utter);
    }

    // --- PLAYBACK ENGINE ---
    document.getElementById('rate').addEventListener('input', (e) => {
        document.getElementById('speed-val').innerText = `${e.target.value}x`;
    });

    function generatePlaylist() {
        let items = [];
        let anySelected = false;

        subjects.forEach(sub => {
            if (document.getElementById(`chk-${sub}`).checked) {
                anySelected = true;
                const startQ = parseInt(document.getElementById(`start-${sub}`).value) || 1;
                const rawList = answerData[sub];
                let startIndex = Math.max(0, Math.min(startQ - 1, rawList.length - 1));

                items.push({ text: sub, html: `<div class='active-subject'>${sub}</div>Starting...`});

                for (let i = startIndex; i < rawList.length; i++) {
                    let parts = rawList[i].split(" ");
                    let qNum = parts[0];
                    let optLet = parts[1];
                    let extra = parts.slice(2).join(" ");
                    let optNum = letterMap[optLet];
                    let speak = `${qNum}, ${optNum}`;
                    if (extra) speak += `, ${extra}`;

                    items.push({
                        text: speak,
                        html: `<div class='active-subject'>${sub}</div>${qNum} ➝ ${optLet}<br><span class='sub-text'>[Audio: ${optNum}]</span>`
                    });
                }
            }
        });

        if(!anySelected) { alert("Please select a subject!"); return []; }
        return items;
    }

    function startCustomPlay() {
        stopEverything();
        playlist = generatePlaylist();
        if(playlist.length > 0) playQueue();
    }

    function playQueue() {
        if (currentIndex >= playlist.length) {
            display.innerText = "All Done ✅";
            display.classList.remove('playing');
            return;
        }

        let item = playlist[currentIndex];
        display.innerHTML = item.html;
        display.classList.add('playing');
        display.classList.remove('paused');
        pauseBtn.innerText = "⏸ Pause";
        isPaused = false;

        currentUtterance = new SpeechSynthesisUtterance(item.text);
        currentUtterance.rate = document.getElementById('rate').value;
        currentUtterance.voice = getSelectedVoice();

        currentUtterance.onend = function() {
            if (!isPaused) {
                currentIndex++;
                playQueue();
            }
        };
        synth.speak(currentUtterance);
    }

    function togglePause() {
        if (playlist.length === 0) return;
        if (isPaused) {
            isPaused = false;
            playQueue(); 
        } else {
            isPaused = true;
            synth.cancel();
            display.classList.add('paused');
            display.classList.remove('playing');
            pauseBtn.innerText = "▶ Resume";
        }
    }

    function stopEverything() {
        synth.cancel();
        playlist = [];
        currentIndex = 0;
        isPaused = false;
        display.innerText = "Ready";
        display.classList.remove('playing', 'paused');
        pauseBtn.innerText = "⏸ Pause";
    }
</script>

</body>
</html>
