<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMI Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 16px;
            color: #e2e8f0;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(96, 165, 250, 0.1) 0%, transparent 50%);
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
            z-index: 0;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        .header {
            text-align: center;
            margin-bottom: 24px;
            padding-top: 12px;
            animation: fadeInUp 0.6s ease-out;
        }
        .header h1 {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 4px;
            animation: pulse 2s ease-in-out infinite;
        }
        .header p {
            color: #94a3b8;
            font-size: 13px;
        }
        .card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 16px;
            padding: clamp(16px, 3vw, 24px);
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.1), transparent);
            transition: left 0.5s;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(96, 165, 250, 0.2);
            border-color: rgba(96, 165, 250, 0.3);
        }
        .card:hover::before {
            left: 100%;
        }
        .main-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 16px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .main-grid.has-results {
            grid-template-columns: 1fr 1fr;
        }
        .input-card {
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .main-grid:not(.has-results) .input-card {
            max-width: 500px;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .main-grid.has-results {
                grid-template-columns: 1fr;
            }
            .main-grid:not(.has-results) .input-card {
                max-width: 100%;
            }
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group:last-of-type {
            margin-bottom: 0;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 500;
        }
        .input-wrapper {
            position: relative;
        }
        .input-prefix {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            border-radius: 12px;
            color: #e2e8f0;
            font-size: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        input.has-prefix {
            padding-left: 40px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #60a5fa;
            background: rgba(15, 23, 42, 0.8);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(96, 165, 250, 0.2);
        }
        .duration-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }
        .duration-toggle button {
            padding: 12px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #94a3b8;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .duration-toggle button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(96, 165, 250, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .duration-toggle button:hover::before {
            width: 300px;
            height: 300px;
        }
        .duration-toggle button:hover {
            transform: translateY(-2px);
            border-color: #60a5fa;
        }
        .duration-toggle button.active {
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            color: white;
            border-color: transparent;
            transform: scale(1.05);
        }
        .calculate-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.3);
            position: relative;
            overflow: hidden;
        }
        .calculate-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        .calculate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(96, 165, 250, 0.5);
        }
        .calculate-btn:hover::before {
            left: 100%;
        }
        .calculate-btn:active {
            transform: scale(0.98);
        }
        .reset-btn {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .reset-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: #ef4444;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
        }
        .reset-btn:active {
            transform: scale(0.95);
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }
        .result-item {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.1) 0%, rgba(167, 139, 250, 0.1) 100%);
            border: 1px solid rgba(148, 163, 184, 0.1);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }
        .result-item:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(96, 165, 250, 0.4);
            box-shadow: 0 8px 24px rgba(96, 165, 250, 0.2);
        }
        .result-item h3 {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: color 0.3s;
        }
        .result-item:hover h3 {
            color: #60a5fa;
        }
        .result-item .value {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 700;
            color: #60a5fa;
            transition: all 0.3s;
        }
        .result-item:hover .value {
            transform: scale(1.1);
            color: #a78bfa;
        }
        .chart-wrapper {
            max-width: 400px;
            margin: 0 auto 24px;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #e2e8f0;
        }
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .pagination-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .pagination-control label {
            font-size: 14px;
            color: #94a3b8;
            margin: 0;
        }
        .pagination-control select {
            width: 80px;
            padding: 8px 12px;
            font-size: 14px;
        }
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.1);
        }
        .schedule-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        .schedule-table th {
            background: rgba(96, 165, 250, 0.1);
            color: #60a5fa;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            white-space: nowrap;
        }
        .schedule-table tr {
            transition: all 0.3s ease;
        }
        .schedule-table tr:hover {
            background: rgba(96, 165, 250, 0.05);
            transform: scale(1.01);
        }
        .schedule-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(148, 163, 184, 0.1);
            color: #cbd5e1;
            transition: color 0.3s;
        }
        .schedule-table tr:hover td {
            color: #60a5fa;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 16px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            background: rgba(15, 23, 42, 0.6);
            color: #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .pagination button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(96, 165, 250, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.4s, height 0.4s;
        }
        .pagination button:hover:not(:disabled)::before {
            width: 200px;
            height: 200px;
        }
        .pagination button:hover:not(:disabled) {
            background: rgba(96, 165, 250, 0.2);
            border-color: #60a5fa;
            transform: translateY(-2px);
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .pagination span {
            font-weight: 600;
            color: #cbd5e1;
            font-size: 14px;
        }
        @media (max-width: 640px) {
            body {
                padding: 12px;
            }
            .results-grid {
                grid-template-columns: 1fr 1fr;
            }
            .schedule-table {
                font-size: 12px;
            }
            .schedule-table th,
            .schedule-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 EMI Calculator</h1>
            <p>Calculate your loan EMI in Indian Rupees</p>
        </div>
        
        <div class="main-grid" id="mainGrid">
            <div class="card input-card">
                <div class="input-group">
                    <label>Loan Amount</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">₹</span>
                        <input type="number" id="loanAmount" class="has-prefix" placeholder="500000" value="500000">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Interest Rate (% per annum)</label>
                    <div class="input-wrapper">
                        <span class="input-prefix">%</span>
                        <input type="number" id="interestRate" class="has-prefix" placeholder="10.5" step="0.1" value="10.5">
                    </div>
                </div>
                
                <div class="input-group">
                    <label>Loan Tenure</label>
                    <div class="duration-toggle">
                        <button type="button" id="monthBtn" class="active">Months</button>
                        <button type="button" id="yearBtn">Years</button>
                    </div>
                    <input type="number" id="duration" placeholder="12" value="12">
                </div>
                
                <div class="input-group">
                    <label>Interest Type</label>
                    <select id="interestType">
                        <option value="compound">Compound Interest</option>
                        <option value="simple">Simple Interest</option>
                    </select>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <button class="calculate-btn" onclick="calculateEMI()">Calculate EMI</button>
                    <button class="reset-btn" style="width: 100%; padding: 16px; border-radius: 12px; font-size: 16px;" onclick="resetCalculator()">🔄 Reset</button>
                </div>
            </div>
            
            <div id="resultsCard" class="card" style="display: none;">
                <div class="results-grid">
                    <div class="result-item">
                        <h3>Monthly EMI</h3>
                        <div class="value" id="emiValue">-</div>
                    </div>
                    <div class="result-item">
                        <h3>Principal</h3>
                        <div class="value" id="principalValue">-</div>
                    </div>
                    <div class="result-item">
                        <h3>Total Interest</h3>
                        <div class="value" id="interestValue">-</div>
                    </div>
                    <div class="result-item">
                        <h3>Total Amount</h3>
                        <div class="value" id="totalValue">-</div>
                    </div>
                    <div class="result-item">
                        <h3>Avg Monthly Interest</h3>
                        <div class="value" id="avgInterestValue">-</div>
                    </div>
                    <div class="result-item">
                        <h3>Duration (Months)</h3>
                        <div class="value" id="durationValue">-</div>
                    </div>
                </div>
                
                <div class="chart-wrapper">
                    <canvas id="pieChart"></canvas>
                </div>
            </div>
        </div>
        
        <div id="scheduleCard" class="card" style="display: none;">
            <div class="pagination-bar">
                <div class="section-title">Payment Schedule</div>
            </div>
            
            <div class="table-container">
                <table class="schedule-table">
                    <thead>
                        <tr>
                            <th>Month</th>
                            <th>EMI</th>
                            <th>Principal</th>
                            <th>Interest</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
            </div>
            
            <div class="pagination" id="pagination">
                <button onclick="changePage(-1)">←</button>
                <div class="pagination-control">
                    <label>Rows:</label>
                    <select id="itemsPerPage" onchange="updatePagination()">
                        <option value="6" selected>6</option>
                        <option value="12">12</option>
                        <option value="24">24</option>
                        <option value="50">50</option>
                    </select>
                </div>
                <span id="pageInfo">1 / 1</span>
                <button onclick="changePage(1)">→</button>
            </div>
        </div>
    </div>

    <script>
        let durationType = 'month';
        let scheduleData = [];
        let currentPage = 1;
        let pieChart = null;

        document.getElementById('monthBtn').addEventListener('click', function() {
            durationType = 'month';
            document.getElementById('monthBtn').classList.add('active');
            document.getElementById('yearBtn').classList.remove('active');
        });

        document.getElementById('yearBtn').addEventListener('click', function() {
            durationType = 'year';
            document.getElementById('yearBtn').classList.add('active');
            document.getElementById('monthBtn').classList.remove('active');
        });

        function formatINR(amount) {
            return '₹' + amount.toLocaleString('en-IN', {
                maximumFractionDigits: 0,
                minimumFractionDigits: 0
            });
        }

        function calculateEMI() {
            const principal = parseFloat(document.getElementById('loanAmount').value);
            const annualRate = parseFloat(document.getElementById('interestRate').value);
            const duration = parseFloat(document.getElementById('duration').value);
            const interestType = document.getElementById('interestType').value;

            if (!principal || !annualRate || !duration) {
                alert('Please fill all fields');
                return;
            }

            const totalMonths = durationType === 'year' ? duration * 12 : duration;
            const monthlyRate = annualRate / 12 / 100;

            let emi, totalInterest, totalAmount;

            if (interestType === 'compound') {
                emi = principal * monthlyRate * Math.pow(1 + monthlyRate, totalMonths) / 
                      (Math.pow(1 + monthlyRate, totalMonths) - 1);
                totalAmount = emi * totalMonths;
                totalInterest = totalAmount - principal;
            } else {
                totalInterest = (principal * annualRate * (totalMonths / 12)) / 100;
                totalAmount = principal + totalInterest;
                emi = totalAmount / totalMonths;
            }

            const avgMonthlyInterest = totalInterest / totalMonths;

            // Show results and trigger layout change
            document.getElementById('mainGrid').classList.add('has-results');
            document.getElementById('resultsCard').style.display = 'block';
            document.getElementById('resultsCard').style.animation = 'slideInRight 0.6s ease-out';
            document.getElementById('emiValue').textContent = formatINR(emi);
            document.getElementById('principalValue').textContent = formatINR(principal);
            document.getElementById('interestValue').textContent = formatINR(totalInterest);
            document.getElementById('totalValue').textContent = formatINR(totalAmount);
            document.getElementById('avgInterestValue').textContent = formatINR(avgMonthlyInterest);
            document.getElementById('durationValue').textContent = totalMonths;

            // Animate result values
            animateValue('emiValue', 0, emi);
            animateValue('principalValue', 0, principal);
            animateValue('interestValue', 0, totalInterest);
            animateValue('totalValue', 0, totalAmount);
            animateValue('avgInterestValue', 0, avgMonthlyInterest);
            animateValueNumber('durationValue', 0, totalMonths);

            generatePieChart(principal, totalInterest);
            generateSchedule(principal, emi, monthlyRate, totalMonths, interestType);
        }

        function animateValue(id, start, end) {
            const element = document.getElementById(id);
            const duration = 1000;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                const current = start + (end - start) * easeOutQuart;
                
                element.textContent = formatINR(current);
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function animateValueNumber(id, start, end) {
            const element = document.getElementById(id);
            const duration = 1000;
            const startTime = performance.now();
            
            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                const easeOutQuart = 1 - Math.pow(1 - progress, 4);
                const current = Math.round(start + (end - start) * easeOutQuart);
                
                element.textContent = current;
                
                if (progress < 1) {
                    requestAnimationFrame(update);
                }
            }
            
            requestAnimationFrame(update);
        }

        function resetCalculator() {
            // Hide results and schedule
            document.getElementById('mainGrid').classList.remove('has-results');
            document.getElementById('resultsCard').style.display = 'none';
            document.getElementById('scheduleCard').style.display = 'none';
            
            // Destroy chart if exists
            if (pieChart) {
                pieChart.destroy();
                pieChart = null;
            }
            
            // Reset form values
            document.getElementById('loanAmount').value = '500000';
            document.getElementById('interestRate').value = '10.5';
            document.getElementById('duration').value = '12';
            document.getElementById('interestType').value = 'compound';
            
            // Reset duration type to months
            durationType = 'month';
            document.getElementById('monthBtn').classList.add('active');
            document.getElementById('yearBtn').classList.remove('active');
            
            // Clear schedule data
            scheduleData = [];
            currentPage = 1;
        }

        function generatePieChart(principal, interest) {
            const ctx = document.getElementById('pieChart').getContext('2d');

            if (pieChart) {
                pieChart.destroy();
            }

            pieChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Principal', 'Interest'],
                    datasets: [{
                        data: [principal, interest],
                        backgroundColor: ['#60a5fa', '#a78bfa'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#cbd5e1',
                                font: { size: 14 },
                                padding: 20
                            }
                        },
                        title: {
                            display: true,
                            text: 'Loan Breakdown',
                            color: '#e2e8f0',
                            font: { size: 16, weight: 'bold' },
                            padding: { bottom: 20 }
                        }
                    }
                }
            });
        }

        function generateSchedule(principal, emi, monthlyRate, totalMonths, interestType) {
            scheduleData = [];
            let balance = principal;

            for (let month = 1; month <= totalMonths; month++) {
                let interestPaid, principalPaid;

                if (interestType === 'compound') {
                    interestPaid = balance * monthlyRate;
                    principalPaid = emi - interestPaid;
                } else {
                    principalPaid = principal / totalMonths;
                    interestPaid = emi - principalPaid;
                }

                balance -= principalPaid;
                if (balance < 0) balance = 0;

                scheduleData.push({
                    month: month,
                    emi: emi,
                    principal: principalPaid,
                    interest: interestPaid,
                    balance: balance
                });
            }

            document.getElementById('scheduleCard').style.display = 'block';
            document.getElementById('scheduleCard').style.animation = 'fadeInUp 0.6s ease-out';
            currentPage = 1;
            updatePagination();
        }

        function updatePagination() {
            const itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
            const totalPages = Math.ceil(scheduleData.length / itemsPerPage);
            
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            displaySchedulePage(currentPage, itemsPerPage);
            displayPaginationButtons(totalPages);
        }

        function changePage(direction) {
            const itemsPerPage = parseInt(document.getElementById('itemsPerPage').value);
            const totalPages = Math.ceil(scheduleData.length / itemsPerPage);
            
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > totalPages) currentPage = totalPages;
            
            updatePagination();
        }

        function displaySchedulePage(page, itemsPerPage) {
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageData = scheduleData.slice(start, end);

            const tbody = document.getElementById('scheduleBody');
            tbody.innerHTML = '';

            pageData.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${row.month}</td>
                    <td>${formatINR(row.emi)}</td>
                    <td>${formatINR(row.principal)}</td>
                    <td>${formatINR(row.interest)}</td>
                    <td>${formatINR(row.balance)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function displayPaginationButtons(totalPages) {
            const pageInfo = document.getElementById('pageInfo');
            pageInfo.textContent = `${currentPage} / ${totalPages}`;
            
            const buttons = document.querySelectorAll('.pagination button');
            buttons[0].disabled = currentPage === 1;
            buttons[1].disabled = currentPage === totalPages;
        }
    </script>
</body>
</html>
